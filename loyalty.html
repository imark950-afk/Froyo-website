  <!-- NAV -->

  <main style="flex: 1 0 auto">

  <!-- LOYALTY -->
  <section id="loyalty" style="max-width: 1240px; margin: 0 auto; padding: 96px 24px; display: flex; flex-wrap: wrap; align-items: center; gap: 56px">
    <div style="flex: 1 1 440px; min-width: 0; display: flex; flex-direction: column; gap: 20px">

        <li style="display: flex; gap: 12px; align-items: flex-start"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#111111" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; margin-top: 2px"><path d="M5 12l5 5L20 7"></path></svg><span><b>+2 bonus stamps</b> every time you book an event</span></li>

      </ul>
      <a href="https://app.froyoonthego.com" style="align-self: flex-start; text-decoration: none; border: 2px solid #111111; padding: 16px 26px; border-radius: 999px; font-weight: 700; font-size: 17px">Get your card</a>
    </div>
    <div style="flex: 1 1 380px; min-width: 0; display: flex; justify-content: center">
      <div role="img" aria-label="Example Froyo stamp card: {{n}} of 9 stamps collected" style="position: relative; overflow: hidden; width: 100%; max-width: 440px; box-sizing: border-box; background: #121212; color: #FFFFFF; border-radius: 26px; padding: 24px; box-shadow: 0 10px 30px rgba(0,0,0,.10); font-family: 'Jost', system-ui, sans-serif">
        <svg viewBox="0 0 170 110" aria-hidden="true" style="position: absolute; right: -10px; top: -6px; width: 170px; pointer-events: none"><path d="M20 0h150v34c-8 0-8 24-17 24s-8-32-17-32-8 50-17 50-8-36-17-36-8 18-17 18-8-26-17-26-8 12-17 12-8-20-17-20z" fill="#FFFFFF" fill-opacity="0.16"></path></svg>
        <div style="position: relative; display: flex; justify-content: space-between; align-items: flex-start; gap: 10px">
          <div>
            <div style="font-size: 11.5px; letter-spacing: 0.08em; text-transform: uppercase; font-weight: 700; color: rgba(255,255,255,.8)">Froyo stamp card</div>
            <h3 style="margin: 2px 0 0; font-family: 'Cormorant Garamond', Garamond, serif; font-size: 30px; font-weight: 700; line-height: 1.1">Hi Sam</h3>
            <div style="font-size: 14px; opacity: 0.92; margin-top: 4px">{{sub}}</div>
          </div>
          <div style="font-family: 'DM Mono', ui-monospace, monospace; font-weight: 500; font-size: 42px; line-height: 1; text-align: right">{{n}}<span style="opacity: 0.6; font-size: 24px">/9</span><small style="display: block; font-family: 'Jost', sans-serif; font-size: 11px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; opacity: 0.85; margin-top: 4px">stamps</small></div>
        </div>
        <div style="position: relative; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; margin-top: 20px">
          <sc-for list="{{stamps}}" as="s" hint-placeholder-count="10">
            <sc-if value="{{s.cup}}" hint-placeholder-val="{{ true }}">
              <div style="aspect-ratio: 1 / 1; border-radius: 50%; background: #FFFFFF; display: flex; align-items: center; justify-content: center; padding: 9%; box-sizing: border-box">
                <svg viewBox="0 0 40 40" width="100%" height="100%" aria-hidden="true">
                  <path d="M3.8 12.4H36.2L33.2 33.4Q33 34.6 31.8 34.6H8.2Q7 34.6 6.8 33.4Z" fill="#121212"></path>
                  <path d="M4.2 12.4H35.8L35.2 16.6H4.8Z" fill="#FFFFFF"></path>
                  <rect x="5.9" y="14" width="3.4" height="5.2" rx="1.7" fill="#FFFFFF"></rect>
                  <rect x="10.3" y="14" width="3.4" height="7.2" rx="1.7" fill="#FFFFFF"></rect>
                  <rect x="14.7" y="14" width="3.4" height="4.5" rx="1.7" fill="#FFFFFF"></rect>
                  <rect x="19.3" y="14" width="3.4" height="7.7" rx="1.7" fill="#FFFFFF"></rect>
                  <rect x="23.9" y="14" width="3.4" height="5.5" rx="1.7" fill="#FFFFFF"></rect>
                  <rect x="28.1" y="14" width="3.4" height="6.8" rx="1.7" fill="#FFFFFF"></rect>
                  <path d="M14.5 31c0-2 1.8-3 3.3-3 0-1.8 1.3-3 2.2-3.8.9.8 2.2 2 2.2 3.8 1.5 0 3.3 1 3.3 3z" fill="#FFFFFF"></path>
                  <rect x="2.6" y="9.8" width="34.8" height="3.4" rx="1.7" fill="#FFFFFF" stroke="#121212" stroke-width="1.2"></rect>
                  <path d="M3.8 12.4H36.2L33.2 33.4Q33 34.6 31.8 34.6H8.2Q7 34.6 6.8 33.4Z" fill="none" stroke="#121212" stroke-width="1.2"></path>
                </svg>
              </div>
            </sc-if>
            <sc-if value="{{s.empty}}" hint-placeholder-val="{{ false }}">
              <div style="aspect-ratio: 1 / 1; border-radius: 50%; border: 2px dashed rgba(255,255,255,.55); display: flex; align-items: center; justify-content: center; font-family: 'DM Mono', ui-monospace, monospace; font-size: 13px; color: rgba(255,255,255,.8); box-sizing: border-box">{{s.num}}</div>
            </sc-if>
            <sc-if value="{{s.free}}" hint-placeholder-val="{{ false }}">
              <div style="aspect-ratio: 1 / 1; border-radius: 50%; border: 2px solid #C9A45C; color: #C9A45C; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; box-sizing: border-box">Free</div>
            </sc-if>
          </sc-for>
        </div>
        <div style="position: relative; display: flex; justify-content: space-between; align-items: center; margin-top: 18px; font-size: 13px; font-weight: 700">
          <span>Member since Sep 2026</span>
          <span style="font-family: 'DM Mono', ui-monospace, monospace; letter-spacing: 0.06em">FR-00042</span>
        </div>
      </div>
    </div>
  </section>

  <!-- CTA -->
  <section style="padding: 0 24px 96px">
    <div style="max-width: 1240px; margin: 0 auto; background: {{accent}}; border-radius: 40px; padding: clamp(40px, 6vw, 80px); display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 32px">
      <h2 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: clamp(36px, 5vw, 64px); line-height: 1; letter-spacing: -0.03em; max-width: 680px">Got a date in mind? Let's get you booked.</h2>
      <a href="https://app.froyoonthego.com" style="text-decoration: none; background: #111111; color: #FFFFFF; padding: 20px 32px; border-radius: 999px; font-weight: 700; font-size: 18px">Book at app.froyoonthego.com</a>
    </div>
  </section>

  </main>

  <!-- FOOTER -->
  <footer id="contact" style="background: #111111; color: #FFFFFF">
    <div style="max-width: 1240px; margin: 0 auto; padding: 56px 24px; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 32px">
      <div style="display: flex; flex-direction: column; gap: 10px">
        <span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 26px">FROYO <span style="font-weight: 500; font-style: italic">on the go</span></span>
        <span style="font-size: 15px; color: #CFCFCF">UK-wide mobile FroYo for events</span>
      </div>
      <div style="display: flex; flex-wrap: wrap; gap: 40px; font-size: 15px">
        <div style="display: flex; flex-direction: column; gap: 8px">
          <span style="font-weight: 700">Contact</span>
          <a href="mailto:froyoontap@gmail.com" style="color: #CFCFCF">froyoontap@gmail.com</a>
          <span style="color: #CFCFCF">[YOUR PHONE]</span>
        </div>
        <div style="display: flex; flex-direction: column; gap: 8px">
          <span style="font-weight: 700">Follow</span>
          <a href="https://www.instagram.com/froyo.onthego/" style="color: #CFCFCF">Instagram @froyo.onthego</a>
          <a href="https://www.tiktok.com/@froyo.onthego" style="color: #CFCFCF">TikTok @froyo.onthego</a>
        </div>
      </div>
    </div>
    <div style="border-top: 1px solid #2E2E2E">
      <p style="max-width: 1240px; margin: 0 auto; padding: 20px 24px; font-size: 13px; color: #A8A8A8">© 2026 froyoonthego.com</p>
    </div>
  </footer>

</div>
</template>
<script type="text/x-dc" id="logic" data-props='{"accent":{"editor":"color","default":"#F6C1CC","options":["#F6C1CC","#C9E4D2","#FFE08A","#C7D8F5"]},"stampsFilled":{"editor":"int","default":6,"min":0,"max":9},"$preview":{"width":1440,"height":1550}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { menuOpen: false, query: '' };
  }
  sitePages() {
    return [
      { label: 'Home', desc: 'Our Story', href: 'index.html', kw: 'our story about us who we are front start main top welcome' },
      { label: 'Services & Events', desc: 'Our cart, trailer and events we cater for', href: 'services.html', kw: 'cart trailer setup indoor outdoor hire events wedding birthday party corporate festival school fair' },
      { label: 'How it works', desc: 'Booking in three easy steps', href: 'how-it-works.html', kw: 'booking steps process date' },
      { label: 'Loyalty card', desc: 'Collect stamps, get free froyo', href: 'loyalty.html', kw: 'stamps rewards free cup card points' },
      { label: 'Book now', desc: 'Check availability & book your event', href: 'https://app.froyoonthego.com', kw: 'book booking availability app reserve' }
    ];
  }
  menuVals() {
    const open = !!this.state.menuOpen;
    const q = (this.state.query || '').trim().toLowerCase();
    const list = this.sitePages().filter((p) => !q || (p.label + ' ' + p.desc + ' ' + p.kw).toLowerCase().includes(q));
    const go = (p) => {
      if (!p) return;
      if (p.href.startsWith('http')) { window.open(p.href, '_blank', 'noopener'); }
      else if (p.href.startsWith('#')) { const el = document.getElementById(p.href.slice(1)); if (el) el.scrollIntoView({ behavior: 'smooth' }); }
      else { const a = document.querySelector('#site-menu a[href="' + p.href + '"]'); if (a) a.click(); return; }
      this.setState({ menuOpen: false, query: '' });
    };
    return {
      menuOpen: open,
      menuExpanded: open ? 'true' : 'false',
      menuBtnBg: open ? '#111111' : 'transparent',
      menuBtnFg: open ? '#FFFFFF' : '#111111',
      toggleMenu: () => this.setState({ menuOpen: !open, query: '' }),
      closeMenu: () => this.setState({ menuOpen: false, query: '' }),
      query: this.state.query || '',
      onQuery: (e) => this.setState({ query: e.target.value }),
      onSearchKey: (e) => {
        if (e.key === 'Escape') this.setState({ menuOpen: false, query: '' });
        if (e.key === 'Enter') { e.preventDefault(); go(list[0]); }
      },
      menuItems: list.map((p, i) => ({ label: p.label, desc: p.desc, href: p.href, bg: q && i === 0 ? '#F1EEE7' : 'transparent' }))
    };
  }
  bindMenuClose() {
    this.onDocPointer = (e) => {
      if (!this.state.menuOpen) return;
      const t = e.target;
      if (t && t.closest && (t.closest('#site-menu') || t.closest('[aria-controls="site-menu"]'))) return;
      this.setState({ menuOpen: false, query: '' });
    };
    this.onDocKey = (e) => { if (e.key === 'Escape' && this.state.menuOpen) this.setState({ menuOpen: false, query: '' }); };
    document.addEventListener('pointerdown', this.onDocPointer);
    document.addEventListener('keydown', this.onDocKey);
  }
  componentDidMount() {
    this.bindMenuClose();
  }
  componentWillUnmount() {
    document.removeEventListener('pointerdown', this.onDocPointer);
    document.removeEventListener('keydown', this.onDocKey);
  }
  renderVals() {
    const accent = this.props.accent ?? '#F6C1CC';
    const n = Math.max(0, Math.min(9, this.props.stampsFilled ?? 6));
    const stamps = [];
    for (let i = 1; i <= 10; i++) {
      const free = i === 10;
      stamps.push({ num: i, cup: !free && i <= n, empty: !free && i > n, free });
    }
    const left = 9 - n;
    const sub = left === 0 ? 'Your free froyo is ready' : left + ' more cup' + (left > 1 ? 's' : '') + ' until a free one';
    return { accent, stamps, n, sub, ...this.menuVals() };
  }
}
</script>
<script src="runtime.js"></script>
