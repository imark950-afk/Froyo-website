          <ul style="margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 10px; font-size: 16px; color: #FFFFFF">
            <li style="display: flex; gap: 10px; align-items: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L20 7"></path></svg>Self-contained serving hatch</li>

<script type="text/x-dc" id="logic" data-props='{"accent":{"editor":"color","default":"#F6C1CC","options":["#F6C1CC","#C9E4D2","#FFE08A","#C7D8F5"]},"$preview":{"width":1440,"height":1700}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { menuOpen: false, query: '' };
  }
  sitePages() {
    return [
      { label: 'Home', desc: 'About us', href: 'index.html', kw: 'about us who we are front start main top welcome' },
      { label: 'Services', desc: 'The Events Cart and the Mobile Trailer', href: 'services.html', kw: 'cart trailer setup indoor outdoor hire' },
      { label: 'Events', desc: 'Weddings, parties, corporate days and more', href: 'events.html', kw: 'wedding birthday party corporate festival school fair' },
      { label: 'How it works', desc: 'Booking in three easy steps', href: 'how-it-works.html', kw: 'booking steps process date' },
      { label: 'Loyalty card', desc: 'Collect stamps, get free froyo', href: 'loyalty.html', kw: 'stamps rewards free cup card points' },
      { label: 'Social', desc: 'Our Instagram, TikTok and Threads posts', href: 'social.html', kw: 'instagram tiktok threads posts photos videos slideshow' },
      { label: 'Book now', desc: 'Check dates at app.froyoonthego.com', href: 'https://app.froyoonthego.com', kw: 'book booking availability app reserve' }
    ];
  }
  menuVals() {
    const open = !!this.state.menuOpen;
    const q = (this.state.query || '').trim().toLowerCase();
    const list = this.sitePages().filter((p) => !q || (p.label + ' ' + p.desc + ' ' + p.kw).toLowerCase().includes(q));
    const go = (p) => {
      if (!p) return;
      if (p.href.startsWith('http')) { window.open(p.href, '_blank', 'noopener'); }
      else if (p.href.startsWith('#')) { const el = document.getElementById(p.href.slice(1)); if (el) el.scrollIntoView({ behavior: 'smooth' }); }
      else { const a = document.querySelector('#site-menu a[href="' + p.href + '"]'); if (a) a.click(); return; }
      this.setState({ menuOpen: false, query: '' });
    };
    return {
      menuOpen: open,
      menuExpanded: open ? 'true' : 'false',
      menuBtnBg: open ? '#111111' : 'transparent',
      menuBtnFg: open ? '#FFFFFF' : '#111111',
      toggleMenu: () => this.setState({ menuOpen: !open, query: '' }),
      closeMenu: () => this.setState({ menuOpen: false, query: '' }),
      query: this.state.query || '',
      onQuery: (e) => this.setState({ query: e.target.value }),
      onSearchKey: (e) => {
        if (e.key === 'Escape') this.setState({ menuOpen: false, query: '' });
        if (e.key === 'Enter') { e.preventDefault(); go(list[0]); }
      },
      menuItems: list.map((p, i) => ({ label: p.label, desc: p.desc, href: p.href, bg: q && i === 0 ? '#F1EEE7' : 'transparent' })),
      noResults: list.length === 0
    };
  }
  renderVals() {
    const accent = this.props.accent ?? '#F6C1CC';
    return { accent, ...this.menuVals() };
  }
}
</script>
