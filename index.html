<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FROYO on the go — Coming soon</title>
<meta name="description" content="The UK’s first mobile FroYo events company. Our new website is coming soon.">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#111111">
<link rel="icon" type="image/png" href="images/froyo-logo.png">
<link rel="apple-touch-icon" href="images/froyo-logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&amp;family=DM+Sans:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%}
  body{background:#FBFAF7;color:#111111;font-family:'DM Sans',system-ui,sans-serif;display:flex;flex-direction:column;min-height:100vh}
  body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:url(images/froyo-logo.png) center 55%/min(78vw,520px) no-repeat;opacity:.06}
  main{flex:1;display:flex;align-items:center;justify-content:center;padding:48px 24px}
  .card{max-width:640px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:22px}
  .logo{width:132px;height:132px;display:block}
  .pill{margin:0;font-size:14px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;background:#F6C1CC;padding:8px 14px;border-radius:999px}
  h1{margin:0;font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:clamp(44px,8vw,84px);line-height:.95;letter-spacing:-.035em}
  p.lead{margin:0;font-size:19px;line-height:1.6;color:#3A3A3A;max-width:520px}
  .actions{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
  .btn{text-decoration:none;font-weight:700;font-size:17px;padding:16px 26px;border-radius:999px;border:2px solid #111111;color:#111111;background:#FFFFFF;min-height:44px}
  .btn.primary{background:#111111;color:#FFFFFF}
  .btn:hover{opacity:.85}
  .social{display:flex;flex-wrap:wrap;gap:8px 20px;justify-content:center;font-size:15px}
  .social a{color:#111111}
  footer{padding:20px 24px;text-align:center;font-size:13px;color:#6B6B6B}
</style>
</head>
<body>
<main>
  <div class="card">
    <img class="logo" src="images/froyo-logo.png" alt="FROYO on the go">
    <p class="pill">Coming soon</p>
    <h1>Our new website is on its way.</h1>
    <p class="lead">The UK’s first mobile FroYo events company. You can already book our FroYo trailer or indoor event cart in our booking app.</p>
    <div class="actions">
      <a class="btn primary" href="https://app.froyoonthego.com">Book at app.froyoonthego.com</a>
      <a class="btn" href="mailto:froyoontap@gmail.com">Email us</a>
    </div>
    <div class="social" aria-label="Follow us">
      <a href="https://www.instagram.com/froyo.onthego/">Instagram</a>
      <a href="https://www.tiktok.com/@froyo.onthego">TikTok</a>
      <a href="https://www.threads.com/@froyo.onthego">Threads</a>
    </div>
  </div>
</main>
<footer>© 2026 froyoonthego.com</footer>
</body>
</html>
