<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FROYO on the go — Home</title>
<meta name="description" content="FROYO on the go brings real frozen yogurt to weddings, parties, corporate events and festivals with our indoor events cart and mobile trailer. Book at app.froyoonthego.com.">
<meta property="og:title" content="FROYO on the go — Home">
<meta property="og:description" content="FROYO on the go brings real frozen yogurt to weddings, parties, corporate events and festivals with our indoor events cart and mobile trailer. Book at app.froyoonthego.com.">
<meta property="og:image" content="https://froyoonthego.com/images/froyo-logo.png">
<meta name="theme-color" content="#111111">
<link rel="icon" type="image/png" href="images/froyo-logo.png">
<link rel="apple-touch-icon" href="images/froyo-logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&amp;family=DM+Sans:wght@400;500;700&amp;family=Cormorant+Garamond:wght@600;700&amp;family=Jost:wght@400;500;700;800&amp;family=DM+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FBFAF7}
a{color:#111111}a:hover{color:#444444}
</style>
</head>
<body>
<div id="root"></div>
<template id="tpl">

<div style="font-family: 'DM Sans', system-ui, sans-serif; color: #111111; background: #FBFAF7; min-height: 100vh; overflow-x: hidden">

  <!-- NAV -->
  <header style="position: relative; z-index: 40; border-bottom: 1px solid #E6E3DC; background: #FBFAF7">
    <nav aria-label="Main" style="max-width: 1240px; margin: 0 auto; padding: 18px 24px; display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: 16px">
      <div style="position: relative; justify-self: start; display: flex; flex-direction: column; align-items: flex-start">
        <button type="button" onClick="{{toggleMenu}}" aria-expanded="{{menuExpanded}}" aria-controls="site-menu" style="font-family: inherit; font-size: 14px; font-weight: 700; min-height: 44px; display: flex; align-items: center; gap: 8px; padding: 8px 16px 8px 12px; border-radius: 999px; border: 2px solid #111111; background: {{menuBtnBg}}; color: {{menuBtnFg}}; cursor: pointer">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"></path></svg>
          Menu
        </button>
        <sc-if value="{{menuOpen}}" hint-placeholder-val="{{ false }}">
          <div id="site-menu" role="dialog" aria-label="Site menu" style="position: absolute; top: 100%; left: 0; margin-top: 10px; z-index: 50; width: 360px; max-width: calc(100vw - 48px); background: #FFFFFF; border: 1px solid #E6E3DC; border-radius: 24px; box-shadow: 0 18px 48px rgba(0,0,0,.16); padding: 16px; display: flex; flex-direction: column; gap: 12px; box-sizing: border-box">
            <div style="display: flex; align-items: center; gap: 8px">
              <label for="site-search" style="flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; border: 2px solid #111111; border-radius: 999px; padding: 0 14px; min-height: 48px; box-sizing: border-box">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#111111" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
                <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Search pages</span>
                <input id="site-search" type="search" placeholder="Search pages…" autocomplete="off" value="{{query}}" onChange="{{onQuery}}" onKeyDown="{{onSearchKey}}" style="flex: 1; min-width: 0; border: 0; outline: none; background: transparent; font-family: inherit; font-size: 16px; color: #111111; padding: 12px 0">
              </label>
              <button type="button" onClick="{{closeMenu}}" aria-label="Close menu" style="flex: none; width: 44px; height: 44px; border-radius: 50%; border: 0; background: #F1EEE7; cursor: pointer; display: flex; align-items: center; justify-content: center; color: #111111">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
              </button>
            </div>
            <ul style="margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 2px">
              <sc-for list="{{menuItems}}" as="m" hint-placeholder-count="7">
                <li>
                  <a href="{{m.href}}" onClick="{{closeMenu}}" style="display: flex; align-items: center; justify-content: space-between; gap: 12px; text-decoration: none; color: #111111; padding: 12px 12px; border-radius: 14px; background: {{m.bg}}">
                    <span style="display: flex; flex-direction: column; gap: 2px; min-width: 0">
                      <span style="font-weight: 700; font-size: 16px">{{m.label}}</span>
                      <span style="font-size: 13.5px; color: #5A5A5A">{{m.desc}}</span>
                    </span>
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#111111" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="M9 18l6-6-6-6"></path></svg>
                  </a>
                </li>
              </sc-for>
            </ul>
            <sc-if value="{{noResults}}" hint-placeholder-val="{{ false }}">
              <p style="margin: 0; padding: 8px 12px 4px; font-size: 15px; color: #5A5A5A">No pages match “{{query}}”. Try “events” or “loyalty”.</p>
            </sc-if>
          </div>
        </sc-if>
      </div>
      <a href="#top" aria-label="FROYO on the go, home" style="justify-self: center; display: block; text-decoration: none">
        <img src="images/froyo-logo.png" alt="FROYO on the go" style="width: 72px; height: 72px; display: block">
      </a>
      <div style="justify-self: end; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 24px; font-size: 15px; font-weight: 500">
        <a href="https://app.froyoonthego.com" style="text-decoration: none; background: #111111; color: #FFFFFF; padding: 12px 20px; border-radius: 999px; font-weight: 700">Book us</a>
      </div>
    </nav>
  </header>

  <!-- HERO -->
  <section id="top" style="max-width: 1240px; margin: 0 auto; padding: 72px 24px 80px; display: flex; flex-wrap: wrap; align-items: center; gap: 56px">
    <div style="flex: 1 1 480px; min-width: 0; display: flex; flex-direction: column; gap: 28px">
      <p style="margin: 0; display: inline-flex; align-self: flex-start; align-items: center; gap: 8px; font-size: 14px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; background: {{accent}}; padding: 8px 14px; border-radius: 999px">Mobile frozen yogurt for events</p>
      <h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: clamp(48px, 7vw, 96px); line-height: 0.95; letter-spacing: -0.035em">Frozen yogurt<br>that comes<br>to you.</h1>
      <p style="margin: 0; font-size: 20px; line-height: 1.55; color: #3A3A3A; max-width: 520px">From weddings and office parties to school fairs and festivals, our indoor cart and mobile trailer bring the swirl straight to your guests.</p>
      <div style="display: flex; flex-wrap: wrap; gap: 12px">
        <a href="https://app.froyoonthego.com" style="text-decoration: none; background: #111111; color: #FFFFFF; padding: 18px 28px; border-radius: 999px; font-weight: 700; font-size: 17px">Check availability</a>
        <a href="#services" style="text-decoration: none; border: 2px solid #111111; padding: 16px 26px; border-radius: 999px; font-weight: 700; font-size: 17px">See our setups</a>
      </div>
    </div>
    <div style="flex: 1 1 380px; min-width: 0; display: flex; justify-content: center">
      <img src="images/froyo-logo.png" alt="FROYO on the go logo" style="width: 100%; max-width: 460px; aspect-ratio: 1 / 1; object-fit: contain; display: block">
    </div>
  </section>

  <!-- SERVICES -->
  <section id="services" style="background: #111111; color: #FFFFFF">
    <div style="max-width: 1240px; margin: 0 auto; padding: 96px 24px; display: flex; flex-direction: column; gap: 48px">
      <div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 24px">
        <h2 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: clamp(36px, 5vw, 60px); line-height: 1; letter-spacing: -0.03em; max-width: 640px">Two ways to bring the froyo.</h2>
        <p style="margin: 0; font-size: 18px; line-height: 1.55; color: #CFCFCF; max-width: 420px">Inside or out, big crowd or small, there's a setup that fits your space.</p>
      </div>
      <div style="display: flex; flex-wrap: wrap; gap: 24px">
        <article style="flex: 1 1 380px; min-width: 0; background: #1E1E1E; border-radius: 28px; padding: 40px; display: flex; flex-direction: column; gap: 20px">
          <div style="width: 56px; height: 56px; border-radius: 16px; background: {{accent}}; display: flex; align-items: center; justify-content: center">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#111111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="7" width="18" height="10" rx="2"></rect><path d="M7 17v3M17 17v3M8 7V4h8v3"></path></svg>
          </div>
          <h3 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 32px; letter-spacing: -0.02em">The Events Cart</h3>
          <p style="margin: 0; font-size: 17px; line-height: 1.6; color: #D6D6D6">Our compact indoor cart wheels into venues, offices, halls and marquees. Ideal for weddings, corporate days and private parties.</p>
          <ul style="margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 10px; font-size: 16px; color: #FFFFFF">
            <li style="display: flex; gap: 10px; align-items: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L20 7"></path></svg>Fits through standard doorways</li>
            <li style="display: flex; gap: 10px; align-items: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L20 7"></path></svg>Served by our own team</li>
            <li style="display: flex; gap: 10px; align-items: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L20 7"></path></svg>From [YOUR PRICE]</li>
          </ul>
        </article>
        <article style="flex: 1 1 380px; min-width: 0; background: #1E1E1E; border-radius: 28px; padding: 40px; display: flex; flex-direction: column; gap: 20px">
          <div style="width: 56px; height: 56px; border-radius: 16px; background: #FFFFFF; display: flex; align-items: center; justify-content: center">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#111111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 16V7a1 1 0 0 1 1-1h13a1 1 0 0 1 1 1v9"></path><path d="M17 10h2l3 3v3h-5"></path><path d="M2 16h20"></path><circle cx="7" cy="18" r="2"></circle><circle cx="17" cy="18" r="2"></circle><path d="M6 10h7"></path></svg>
          </div>
          <h3 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 32px; letter-spacing: -0.02em">The Mobile Trailer</h3>
          <p style="margin: 0; font-size: 17px; line-height: 1.6; color: #D6D6D6">Our serving trailer pulls up outdoors and keeps the queue moving. Built for festivals, fêtes, sports days and big gatherings.</p>
          <ul style="margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 10px; font-size: 16px; color: #FFFFFF">
            <li style="display: flex; gap: 10px; align-items: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L20 7"></path></svg>Self-contained serving hatch</li>
            <li style="display: flex; gap: 10px; align-items: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L20 7"></path></svg>Great for larger crowds</li>
            <li style="display: flex; gap: 10px; align-items: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L20 7"></path></svg>From [YOUR PRICE]</li>
          </ul>
        </article>
      </div>
    </div>
  </section>

  <!-- EVENTS -->
  <section id="events" style="max-width: 1240px; margin: 0 auto; padding: 96px 24px; display: flex; flex-direction: column; gap: 40px">
    <h2 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: clamp(36px, 5vw, 60px); line-height: 1; letter-spacing: -0.03em">Made for your moment.</h2>
    <div style="display: flex; flex-wrap: wrap; gap: 12px">
      <span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: clamp(20px, 2.4vw, 30px); border: 2px solid #111111; border-radius: 999px; padding: 14px 28px">Weddings</span>
      <span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: clamp(20px, 2.4vw, 30px); background: {{accent}}; border: 2px solid #111111; border-radius: 999px; padding: 14px 28px">Birthday parties</span>
      <span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: clamp(20px, 2.4vw, 30px); border: 2px solid #111111; border-radius: 999px; padding: 14px 28px">Corporate events</span>
      <span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: clamp(20px, 2.4vw, 30px); background: #111111; color: #FFFFFF; border: 2px solid #111111; border-radius: 999px; padding: 14px 28px">Festivals</span>
      <span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: clamp(20px, 2.4vw, 30px); border: 2px solid #111111; border-radius: 999px; padding: 14px 28px">School fairs</span>
      <span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: clamp(20px, 2.4vw, 30px); border: 2px solid #111111; border-radius: 999px; padding: 14px 28px">Product launches</span>
      <span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: clamp(20px, 2.4vw, 30px); background: {{accent}}; border: 2px solid #111111; border-radius: 999px; padding: 14px 28px">Sports days</span>
      <span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: clamp(20px, 2.4vw, 30px); border: 2px dashed #111111; border-radius: 999px; padding: 14px 28px">Something else? Ask us</span>
    </div>
  </section>

  <!-- HOW IT WORKS -->
  <section id="how" style="background: #F1EEE7">
    <div style="max-width: 1240px; margin: 0 auto; padding: 96px 24px; display: flex; flex-direction: column; gap: 48px">
      <h2 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: clamp(36px, 5vw, 60px); line-height: 1; letter-spacing: -0.03em">Booking is easy.</h2>
      <ol style="margin: 0; padding: 0; list-style: none; display: flex; flex-wrap: wrap; gap: 24px">
        <li style="flex: 1 1 280px; min-width: 0; display: flex; flex-direction: column; gap: 14px">
          <span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 72px; line-height: 1; letter-spacing: -0.04em">01</span>
          <h3 style="margin: 0; font-size: 22px; font-weight: 700">Pick your date</h3>
          <p style="margin: 0; font-size: 17px; line-height: 1.6; color: #3A3A3A">Check live availability in our booking app and choose the cart or the trailer.</p>
        </li>
        <li style="flex: 1 1 280px; min-width: 0; display: flex; flex-direction: column; gap: 14px">
          <span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 72px; line-height: 1; letter-spacing: -0.04em">02</span>
          <h3 style="margin: 0; font-size: 22px; font-weight: 700">Tell us about the event</h3>
          <p style="margin: 0; font-size: 17px; line-height: 1.6; color: #3A3A3A">Venue, guest numbers, timings, anything we should know. We'll confirm the details with you.</p>
        </li>
        <li style="flex: 1 1 280px; min-width: 0; display: flex; flex-direction: column; gap: 14px">
          <span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 72px; line-height: 1; letter-spacing: -0.04em">03</span>
          <h3 style="margin: 0; font-size: 22px; font-weight: 700">We roll up and serve</h3>
          <p style="margin: 0; font-size: 17px; line-height: 1.6; color: #3A3A3A">We arrive, set up and serve fresh frozen yogurt with toppings. You enjoy the party.</p>
        </li>
      </ol>
      <a href="https://app.froyoonthego.com" style="align-self: flex-start; text-decoration: none; background: #111111; color: #FFFFFF; padding: 18px 28px; border-radius: 999px; font-weight: 700; font-size: 17px">Start a booking</a>
    </div>
  </section>

  <!-- LOYALTY -->
  <section id="loyalty" style="max-width: 1240px; margin: 0 auto; padding: 96px 24px; display: flex; flex-wrap: wrap; align-items: center; gap: 56px">
    <div style="flex: 1 1 440px; min-width: 0; display: flex; flex-direction: column; gap: 20px">
      <p style="margin: 0; font-size: 14px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase">Loyalty card</p>
      <h2 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: clamp(36px, 5vw, 60px); line-height: 1; letter-spacing: -0.03em">Collect stamps. Get free froyo.</h2>
      <p style="margin: 0; font-size: 18px; line-height: 1.6; color: #3A3A3A; max-width: 500px">Show your code in the app every time you order at the cart or trailer. Buy 9 cups and the 10th is on us, any size, any toppings.</p>
      <ul style="margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 12px; font-size: 16px; max-width: 500px">
        <li style="display: flex; gap: 12px; align-items: flex-start"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#111111" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; margin-top: 2px"><path d="M5 12l5 5L20 7"></path></svg><span><b>+2 bonus stamps</b> every time you book an event</span></li>
        <li style="display: flex; gap: 12px; align-items: flex-start"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#111111" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; margin-top: 2px"><path d="M5 12l5 5L20 7"></path></svg><span><b>Birthday treat:</b> a free cup any day in your birthday week</span></li>
        <li style="display: flex; gap: 12px; align-items: flex-start"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#111111" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; margin-top: 2px"><path d="M5 12l5 5L20 7"></path></svg><span><b>Double stamp Tuesdays</b> at the trailer</span></li>
      </ul>
      <a href="https://app.froyoonthego.com" style="align-self: flex-start; text-decoration: none; border: 2px solid #111111; padding: 16px 26px; border-radius: 999px; font-weight: 700; font-size: 17px">Get your card</a>
    </div>
    <div style="flex: 1 1 380px; min-width: 0; display: flex; justify-content: center">
      <div role="img" aria-label="Example Froyo stamp card: {{n}} of 9 stamps collected" style="position: relative; overflow: hidden; width: 100%; max-width: 440px; box-sizing: border-box; background: #121212; color: #FFFFFF; border-radius: 26px; padding: 24px; box-shadow: 0 10px 30px rgba(0,0,0,.10); font-family: 'Jost', system-ui, sans-serif">
        <svg viewBox="0 0 170 110" aria-hidden="true" style="position: absolute; right: -10px; top: -6px; width: 170px; pointer-events: none"><path d="M20 0h150v34c-8 0-8 24-17 24s-8-32-17-32-8 50-17 50-8-36-17-36-8 18-17 18-8-26-17-26-8 12-17 12-8-20-17-20z" fill="#FFFFFF" fill-opacity="0.16"></path></svg>
        <div style="position: relative; display: flex; justify-content: space-between; align-items: flex-start; gap: 10px">
          <div>
            <div style="font-size: 11.5px; letter-spacing: 0.08em; text-transform: uppercase; font-weight: 700; color: rgba(255,255,255,.8)">Froyo stamp card</div>
            <h3 style="margin: 2px 0 0; font-family: 'Cormorant Garamond', Garamond, serif; font-size: 30px; font-weight: 700; line-height: 1.1">Hi Sam</h3>
            <div style="font-size: 14px; opacity: 0.92; margin-top: 4px">{{sub}}</div>
          </div>
          <div style="font-family: 'DM Mono', ui-monospace, monospace; font-weight: 500; font-size: 42px; line-height: 1; text-align: right">{{n}}<span style="opacity: 0.6; font-size: 24px">/9</span><small style="display: block; font-family: 'Jost', sans-serif; font-size: 11px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; opacity: 0.85; margin-top: 4px">stamps</small></div>
        </div>
        <div style="position: relative; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; margin-top: 20px">
          <sc-for list="{{stamps}}" as="s" hint-placeholder-count="10">
            <sc-if value="{{s.cup}}" hint-placeholder-val="{{ true }}">
              <div style="aspect-ratio: 1 / 1; border-radius: 50%; background: #FFFFFF; display: flex; align-items: center; justify-content: center; padding: 9%; box-sizing: border-box">
                <svg viewBox="0 0 40 40" width="100%" height="100%" aria-hidden="true">
                  <path d="M3.8 12.4H36.2L33.2 33.4Q33 34.6 31.8 34.6H8.2Q7 34.6 6.8 33.4Z" fill="#121212"></path>
                  <path d="M4.2 12.4H35.8L35.2 16.6H4.8Z" fill="#FFFFFF"></path>
                  <rect x="5.9" y="14" width="3.4" height="5.2" rx="1.7" fill="#FFFFFF"></rect>
                  <rect x="10.3" y="14" width="3.4" height="7.2" rx="1.7" fill="#FFFFFF"></rect>
                  <rect x="14.7" y="14" width="3.4" height="4.5" rx="1.7" fill="#FFFFFF"></rect>
                  <rect x="19.3" y="14" width="3.4" height="7.7" rx="1.7" fill="#FFFFFF"></rect>

<script type="text/x-dc" id="logic" data-props='{"accent":{"editor":"color","default":"#F6C1CC","options":["#F6C1CC","#C9E4D2","#FFE08A","#C7D8F5"]},"stampsFilled":{"editor":"int","default":6,"min":0,"max":9},"$preview":{"width":1440,"height":4300}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { menuOpen: false, query: '' };
  }
  sitePages() {
    const home = '';
    return [
      { label: 'Home', desc: 'The front page', href: home + '#top', kw: 'front start main top' },
      { label: 'Services', desc: 'The Events Cart and the Mobile Trailer', href: home + '#services', kw: 'cart trailer setup indoor outdoor hire' },
      { label: 'Events', desc: 'Weddings, parties, corporate days and more', href: home + '#events', kw: 'wedding birthday party corporate festival school fair' },
      { label: 'How it works', desc: 'Booking in three easy steps', href: home + '#how', kw: 'booking steps process date' },
      { label: 'Loyalty card', desc: 'Collect stamps, get free froyo', href: home + '#loyalty', kw: 'stamps rewards free cup card points' },
      { label: 'Social', desc: 'Our Instagram, TikTok and Threads posts', href: 'social.html', kw: 'instagram tiktok threads posts photos videos slideshow' },
      { label: 'Book now', desc: 'Check dates at app.froyoonthego.com', href: 'https://app.froyoonthego.com', kw: 'book booking availability app reserve' }
    ];
  }
  menuVals() {
    const open = !!this.state.menuOpen;
    const q = (this.state.query || '').trim().toLowerCase();
    const list = this.sitePages().filter((p) => !q || (p.label + ' ' + p.desc + ' ' + p.kw).toLowerCase().includes(q));
    const go = (p) => {
      if (!p) return;
      if (p.href.startsWith('http')) { window.open(p.href, '_blank', 'noopener'); }
      else if (p.href.startsWith('#')) { const el = document.getElementById(p.href.slice(1)); if (el) el.scrollIntoView({ behavior: 'smooth' }); }
      else { return; }
      this.setState({ menuOpen: false, query: '' });
    };
    return {
      menuOpen: open,
      menuExpanded: open ? 'true' : 'false',
      menuBtnBg: open ? '#111111' : 'transparent',
      menuBtnFg: open ? '#FFFFFF' : '#111111',
      toggleMenu: () => this.setState({ menuOpen: !open, query: '' }),
      closeMenu: () => this.setState({ menuOpen: false, query: '' }),
      query: this.state.query || '',
      onQuery: (e) => this.setState({ query: e.target.value }),
      onSearchKey: (e) => {
        if (e.key === 'Escape') this.setState({ menuOpen: false, query: '' });
        if (e.key === 'Enter') { e.preventDefault(); go(list[0]); }
      },
      menuItems: list.map((p, i) => ({ label: p.label, desc: p.desc, href: p.href, bg: q && i === 0 ? '#F1EEE7' : 'transparent' })),
      noResults: list.length === 0
    };
  }
  renderVals() {
    const accent = this.props.accent ?? '#F6C1CC';
    const n = Math.max(0, Math.min(9, this.props.stampsFilled ?? 6));
    const stamps = [];
    for (let i = 1; i <= 10; i++) {
      const free = i === 10;
      stamps.push({ num: i, cup: !free && i <= n, empty: !free && i > n, free });
    }
    const left = 9 - n;
    const sub = left === 0 ? 'Your free froyo is ready' : left + ' more cup' + (left > 1 ? 's' : '') + ' until a free one';
    return { accent, stamps, n, sub, ...this.menuVals() };
  }
}
</script>
